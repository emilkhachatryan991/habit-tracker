<!doctype html>
<title>Орбиты привычек</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070d;
    --bg-2:#0b0f19;
    --bg-3:#121729;
    --line:#20283b;
    --line-soft:#161c2c;
    --text:#eef1f8;
    --text-muted:#7c88a0;
    --accent:#6fe3ff;
    --accent-strong:#a6eeff;
    --accent-soft:rgba(111,227,255,.13);
    --accent-glow:rgba(111,227,255,.38);
    --danger:#ff8272;
    --danger-soft:rgba(255,130,114,.16);
  }

  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding-inline:20px;
    padding-block:48px 72px;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  img{max-width:100%;}
  [hidden]{display:none!important;}

  /* -- cosmos backdrop -- */
  .cosmos{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .cosmos .stars{
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(1.3px 1.3px at 6% 14%, rgba(238,241,248,.85), transparent 60%),
      radial-gradient(1px 1px at 12% 42%, rgba(238,241,248,.55), transparent 60%),
      radial-gradient(1.6px 1.6px at 18% 8%, rgba(238,241,248,.75), transparent 60%),
      radial-gradient(1px 1px at 24% 66%, rgba(238,241,248,.45), transparent 60%),
      radial-gradient(1.2px 1.2px at 30% 24%, rgba(238,241,248,.7), transparent 60%),
      radial-gradient(1px 1px at 37% 78%, rgba(238,241,248,.5), transparent 60%),
      radial-gradient(1.6px 1.6px at 44% 12%, rgba(238,241,248,.8), transparent 60%),
      radial-gradient(1px 1px at 50% 52%, rgba(238,241,248,.4), transparent 60%),
      radial-gradient(1.3px 1.3px at 57% 88%, rgba(238,241,248,.6), transparent 60%),
      radial-gradient(1px 1px at 63% 30%, rgba(238,241,248,.5), transparent 60%),
      radial-gradient(1.6px 1.6px at 70% 6%, rgba(238,241,248,.75), transparent 60%),
      radial-gradient(1px 1px at 76% 60%, rgba(238,241,248,.45), transparent 60%),
      radial-gradient(1.2px 1.2px at 82% 20%, rgba(238,241,248,.7), transparent 60%),
      radial-gradient(1px 1px at 88% 74%, rgba(238,241,248,.5), transparent 60%),
      radial-gradient(1.6px 1.6px at 94% 38%, rgba(238,241,248,.8), transparent 60%),
      radial-gradient(1px 1px at 4% 88%, rgba(238,241,248,.4), transparent 60%),
      radial-gradient(1.2px 1.2px at 96% 92%, rgba(238,241,248,.55), transparent 60%),
      radial-gradient(1px 1px at 41% 94%, rgba(238,241,248,.4), transparent 60%);
    background-repeat:no-repeat;
  }
  .cosmos .glow{
    position:absolute;
    width:46vw;
    height:46vw;
    border-radius:50%;
    filter:blur(90px);
    opacity:.14;
  }
  .cosmos .glow.a{ top:-14vw; left:-10vw; background:var(--accent); }
  .cosmos .glow.b{ bottom:-18vw; right:-8vw; background:#8f7bff; opacity:.10; }

  .page{
    position:relative;
    z-index:1;
    max-width:820px;
    margin-inline:auto;
    display:flex;
    flex-direction:column;
    gap:34px;
  }

  header.topbar{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .eyebrow{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  h1{
    font-family:"Sora",-apple-system,sans-serif;
    font-weight:600;
    font-size:clamp(28px,5vw,36px);
    line-height:1.15;
    margin:0;
    letter-spacing:-.01em;
    text-wrap:balance;
  }
  .subtitle{
    margin:0;
    color:var(--text-muted);
    font-size:14.5px;
  }
  .subtitle strong{
    color:var(--accent);
    font-variant-numeric:tabular-nums;
    font-weight:600;
  }

  form.add-form{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  form.add-form input{
    flex:1 1 240px;
    min-width:0;
    background:var(--bg-3);
    border:1px solid var(--line);
    border-radius:9px;
    padding:13px 16px;
    font:inherit;
    font-size:14.5px;
    color:var(--text);
  }
  form.add-form input::placeholder{color:var(--text-muted);}
  form.add-form input:focus-visible{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  form.add-form button{
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:9px;
    padding:13px 20px;
    font:inherit;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  form.add-form button:hover{ background:var(--accent-soft); box-shadow:0 0 20px -6px var(--accent-glow); }
  form.add-form button:active{transform:translateY(1px);}
  form.add-form button:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--accent-soft); }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:14px;
  }

  .card{
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 18px 16px;
    display:flex;
    flex-direction:column;
    gap:16px;
    min-width:0;
    transition:border-color .2s ease;
  }
  .card:hover{ border-color:var(--line-soft); border-color:#2a3450; }

  .card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .card-title{
    font-family:"Sora",-apple-system,sans-serif;
    font-weight:600;
    font-size:16.5px;
    line-height:1.3;
    margin:0;
    word-break:break-word;
    text-wrap:balance;
  }

  .streak-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:12px;
    font-weight:500;
    color:var(--accent);
    white-space:nowrap;
    flex:0 0 auto;
    padding-top:2px;
  }
  .streak-badge svg{width:14px;height:14px;flex:0 0 auto;}
  .streak-badge .n{font-variant-numeric:tabular-nums;}

  .del-btn{
    flex:0 0 auto;
    width:26px;height:26px;
    border-radius:7px;
    border:1px solid transparent;
    background:transparent;
    color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .del-btn:hover{ color:var(--danger); background:var(--danger-soft); }
  .del-btn:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--danger-soft); }
  .del-btn svg{width:14px;height:14px;}
  .del-btn.confirming{
    width:auto;
    padding:0 10px;
    gap:6px;
    background:var(--danger-soft);
    color:var(--danger);
    border-color:var(--danger);
    font-size:11.5px;
    font-weight:600;
    font-family:"Manrope",sans-serif;
  }

  .day-strip{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }
  .day-cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .day-cell .dow{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:9.5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .day-mark{
    width:100%;
    aspect-ratio:1;
    border-radius:50%;
    background:transparent;
    border:1px solid var(--line);
  }
  .day-cell.today .day-mark{
    border-color:var(--accent);
    border-width:1.5px;
  }
  .day-mark.done{
    background:var(--accent);
    border-color:var(--accent);
    box-shadow:0 0 9px -1px var(--accent-glow);
  }
  .day-cell.today .dow{color:var(--accent); font-weight:600;}

  .card-foot{
    display:flex;
    align-items:center;
    justify-content:flex-end;
  }
  .toggle-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    border-radius:9px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text-muted);
    font:inherit;
    font-size:13.5px;
    font-weight:600;
    padding:10px 14px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .toggle-btn:hover{border-color:#2a3450; color:var(--text);}
  .toggle-btn:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
  .toggle-btn.done{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
  }
  .toggle-btn svg{width:14px;height:14px;flex:0 0 auto;}

  .empty{
    border:1px dashed var(--line);
    border-radius:12px;
    padding:52px 24px;
    text-align:center;
    color:var(--text-muted);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .empty svg{width:26px;height:26px;color:var(--accent);opacity:.8;}
  .empty p{margin:0; max-width:32ch; font-size:14px;}

  @media (prefers-reduced-motion: no-preference){
    .cosmos .glow.a{ animation:driftA 70s ease-in-out infinite alternate; }
    .cosmos .glow.b{ animation:driftB 80s ease-in-out infinite alternate; }
  }
  @keyframes driftA{ from{ transform:translate(0,0);} to{ transform:translate(3vw,4vw);} }
  @keyframes driftB{ from{ transform:translate(0,0);} to{ transform:translate(-3vw,-3vw);} }
</style>

<div class="cosmos">
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="stars"></div>
</div>

<div class="page">
  <header class="topbar">
    <span class="eyebrow">Трекер привычек</span>
    <h1>Орбиты привычек</h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <form class="add-form" id="addForm">
    <input id="habitInput" type="text" maxlength="60" autocomplete="off"
           placeholder="Например: Смотреть на звёзды 10 минут" required>
    <button type="submit">Добавить привычку</button>
  </form>

  <main class="grid" id="grid"></main>

  <div class="empty" id="empty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12 3l2.4 6.3L21 12l-6.6 2.7L12 21l-2.4-6.3L3 12l6.6-2.7L12 3z"/></svg>
    <p>Привычек пока нет. Добавьте первую в поле выше — например, «Читать 20 минут» — и начните отмечать дни.</p>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "habits-tracker-v1";
  var DOW = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];

  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function keyOf(date){
    return date.getFullYear()+"-"+pad(date.getMonth()+1)+"-"+pad(date.getDate());
  }
  function todayKey(){ return keyOf(new Date()); }
  function addDays(date, n){
    var d = new Date(date);
    d.setDate(d.getDate()+n);
    return d;
  }
  function last7Keys(){
    var out = [];
    var today = new Date();
    for(var i=6;i>=0;i--){ out.push(keyOf(addDays(today,-i))); }
    return out;
  }
  function uid(){
    return "h_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  function loadHabits(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      var data = JSON.parse(raw);
      if(!Array.isArray(data)) return null;
      return data.map(function(h){
        return {
          id: h.id || uid(),
          name: String(h.name || "").slice(0,60),
          createdAt: h.createdAt || todayKey(),
          done: Array.isArray(h.done) ? h.done : []
        };
      });
    }catch(e){ return null; }
  }

  function saveHabits(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(habits)); }
    catch(e){ /* storage unavailable — state just won't persist */ }
  }

  function exampleHabits(){
    var today = new Date();
    function doneSet(offsetsAgo){
      return offsetsAgo.map(function(i){ return keyOf(addDays(today,-i)); });
    }
    return [
      { id: uid(), name: "Пить 2 литра воды", createdAt: keyOf(addDays(today,-9)),
        done: doneSet([0,1,2,3,4,6]) },
      { id: uid(), name: "Читать 20 минут",   createdAt: keyOf(addDays(today,-9)),
        done: doneSet([1,2,3,4,5,6,7,8]) },
      { id: uid(), name: "Растяжка перед сном", createdAt: keyOf(addDays(today,-9)),
        done: doneSet([3]) }
    ];
  }

  var habits = loadHabits();
  if(habits === null){ habits = exampleHabits(); saveHabits(); }

  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var subtitle = document.getElementById("subtitle");
  var addForm = document.getElementById("addForm");
  var habitInput = document.getElementById("habitInput");

  function streakFor(habit){
    var doneSet = {};
    habit.done.forEach(function(k){ doneSet[k] = true; });
    var cursor = new Date();
    if(!doneSet[keyOf(cursor)]) cursor = addDays(cursor,-1);
    var count = 0;
    while(doneSet[keyOf(cursor)]){
      count++;
      cursor = addDays(cursor,-1);
    }
    return count;
  }

  function orbitSVG(){
    return '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.4" stroke-dasharray="1.6 3.4"/><circle cx="12" cy="4.5" r="1.6" fill="currentColor"/></svg>';
  }
  function checkSVG(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  }
  function trashSVG(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
  }

  function render(){
    var today = todayKey();
    grid.innerHTML = "";
    empty.hidden = habits.length !== 0;

    var doneToday = habits.filter(function(h){ return h.done.indexOf(today) !== -1; }).length;
    if(habits.length === 0){
      subtitle.textContent = "";
    } else {
      subtitle.innerHTML = 'Сегодня выполнено <strong>'+doneToday+' из '+habits.length+'</strong>';
    }

    var keys = last7Keys();

    habits.forEach(function(habit){
      var isDoneToday = habit.done.indexOf(today) !== -1;
      var streak = streakFor(habit);

      var card = document.createElement("article");
      card.className = "card";

      var head = document.createElement("div");
      head.className = "card-head";

      var title = document.createElement("h2");
      title.className = "card-title";
      title.textContent = habit.name;
      head.appendChild(title);

      var delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "del-btn";
      delBtn.innerHTML = trashSVG();
      delBtn.setAttribute("aria-label", "Удалить привычку «"+habit.name+"»");
      delBtn.addEventListener("click", function(){
        if(delBtn.dataset.confirm === "1"){
          habits = habits.filter(function(h){ return h.id !== habit.id; });
          saveHabits();
          render();
        } else {
          delBtn.dataset.confirm = "1";
          delBtn.classList.add("confirming");
          delBtn.textContent = "Удалить?";
          setTimeout(function(){
            delBtn.dataset.confirm = "0";
            delBtn.classList.remove("confirming");
            delBtn.innerHTML = trashSVG();
            delBtn.setAttribute("aria-label", "Удалить привычку «"+habit.name+"»");
          }, 2600);
        }
      });
      head.appendChild(delBtn);
      card.appendChild(head);

      var strip = document.createElement("div");
      strip.className = "day-strip";
      keys.forEach(function(k){
        var d = new Date(k+"T00:00:00");
        var cell = document.createElement("div");
        cell.className = "day-cell" + (k === today ? " today" : "");
        var dow = document.createElement("span");
        dow.className = "dow";
        dow.textContent = DOW[d.getDay()];
        var mark = document.createElement("span");
        mark.className = "day-mark" + (habit.done.indexOf(k) !== -1 ? " done" : "");
        cell.appendChild(dow);
        cell.appendChild(mark);
        strip.appendChild(cell);
      });
      card.appendChild(strip);

      var foot = document.createElement("div");
      foot.className = "card-foot";
      var toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "toggle-btn" + (isDoneToday ? " done" : "");
      toggle.innerHTML = (isDoneToday ? checkSVG() : "") + "<span>"+(isDoneToday ? "Выполнено сегодня" : "Отметить выполненным")+"</span>";
      toggle.addEventListener("click", function(){
        var idx = habit.done.indexOf(today);
        if(idx === -1){ habit.done.push(today); }
        else { habit.done.splice(idx,1); }
        saveHabits();
        render();
      });
      foot.appendChild(toggle);
      card.appendChild(foot);

      if(streak > 0){
        var badge = document.createElement("span");
        badge.className = "streak-badge";
        badge.innerHTML = orbitSVG() + '<span class="n">'+streak+'</span>';
        badge.title = streak + (streak === 1 ? " день подряд" : " дней подряд");
        head.insertBefore(badge, delBtn);
      }

      grid.appendChild(card);
    });
  }

  addForm.addEventListener("submit", function(e){
    e.preventDefault();
    var name = habitInput.value.trim();
    if(!name) return;
    habits.push({ id: uid(), name: name, createdAt: todayKey(), done: [] });
    saveHabits();
    habitInput.value = "";
    render();
    habitInput.focus();
  });

  render();
})();
</script>
